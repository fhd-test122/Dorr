                      refreshFavoritesUI()

                      btnNewHadith.setOnClickListener {
                          btnNewHadith.isEnabled = false
                          btnNewHadith.text = "جاري الجلب..."
                          lifecycleScope.launch {
                              val item = HadithRepository.fetchOnlineHadith(this@MainActivity)
                              displayHadith(item)
                              HadithWidgetProvider.updateAllWidgets(this@MainActivity)
                              btnNewHadith.isEnabled = true
                              btnNewHadith.text = "حديث جديد ↻"
                          }
                      }

                      btnShareMain.setOnClickListener {
                          val h = HadithRepository.getCurrentHadith(this)
                          val shareText = h.matn + "\n\nالراوي: " + h.rawi + " | المصدر: " + h.source + " (" + h.grade + ")\n\nالشرح:\n" + h.sharh
                          val shareIntent = Intent(Intent.ACTION_SEND).apply {
                              type = "text/plain"
                              putExtra(Intent.EXTRA_TEXT, shareText)
                          }
                          startActivity(Intent.createChooser(shareIntent, "مشاركة الحديث النبوي وشرحه"))
                      }

                      btnSearch.setOnClickListener {
                          val q = etSearch.text.toString().trim()
                          if (q.isNotEmpty()) {
                              Toast.makeText(this, "جاري البحث في الموسوعة الحديثية...", Toast.LENGTH_SHORT).show()
                              lifecycleScope.launch {
                                  val item = HadithRepository.fetchOnlineHadith(this@MainActivity, q)
                                  displayHadith(item)
                                  HadithWidgetProvider.updateAllWidgets(this@MainActivity)
                              }
                          }
                      }

                      btnAddFav.setOnClickListener {
                          val current = HadithRepository.getCurrentHadith(this)
                          HadithRepository.addFavorite(this, current)
                          refreshFavoritesUI()
                          Toast.makeText(this, "تم حفظ الحديث في المفضلة ★", Toast.LENGTH_SHORT).show()
                      }

                      // --- إعدادات استوديو الويدجت ---
                      val bgLabels = arrayOf("كحلي زجاجي داكن", "أسود فحمي ملكي", "أخضر زمردي داكن", "بني كلاسيكي دافئ", "بنفسجي ليلي", "أبيض ناصع")
                      val bgHexes = arrayOf("#0F172A", "#09090B", "#064E3B", "#271C19", "#1E1B4B", "#FFFFFF")

                      val txtLabels = arrayOf("أبيض ناصع", "ذهبي فاخر", "سماوي هادئ", "أخضر زمردي فاتح", "أسود داكن (للخلفية البيضاء)")
                      val txtHexes = arrayOf("#FFFFFF", "#FACC15", "#38BDF8", "#34D399", "#0F172A")

                      spinnerBgColor.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, bgLabels)
                      spinnerTextColor.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, txtLabels)

                      val currentStyle = HadithRepository.getWidgetStyle(this)
                      spinnerBgColor.setSelection(bgHexes.indexOf(currentStyle.bgColorHex).coerceAtLeast(0))
                      spinnerTextColor.setSelection(txtHexes.indexOf(currentStyle.textColorHex).coerceAtLeast(0))

                      seekOpacity.progress = currentStyle.opacityPercent
                      tvOpacityLabel.text = "2. درجة التعتيم / الشفافية: " + currentStyle.opacityPercent + "%"

                      val initialFontProgress = (currentStyle.fontSizeSp.toInt() - 12).coerceIn(0, 14)
                      seekFontSize.progress = initialFontProgress
                      tvFontSizeLabel.text = "3. حجم خط الحديث في الويدجت: " + currentStyle.fontSizeSp.toInt()

                      fun saveAndApplyStyle() {
                          val chosenBg = bgHexes[spinnerBgColor.selectedItemPosition]
                          val chosenTxt = txtHexes[spinnerTextColor.selectedItemPosition]
                          val chosenOpacity = seekOpacity.progress
                          val chosenFont = (12 + seekFontSize.progress).toFloat()

                          val newStyle = WidgetStyleConfig(
                              bgColorHex = chosenBg,
                              opacityPercent = chosenOpacity,
                              fontSizeSp = chosenFont,
                              textColorHex = chosenTxt
                          )
                          HadithRepository.saveWidgetStyle(this, newStyle)
                          HadithWidgetProvider.updateAllWidgets(this)
                      }

                      spinnerBgColor.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) = saveAndApplyStyle()
                          override fun onNothingSelected(p: AdapterView<*>?) {}
                      }

                      spinnerTextColor.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) = saveAndApplyStyle()
                          override fun onNothingSelected(p: AdapterView<*>?) {}
                      }

                      seekOpacity.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              tvOpacityLabel.text = "2. درجة التعتيم / الشفافية: " + progress + "%"
                              if (fromUser) saveAndApplyStyle()
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) = saveAndApplyStyle()
                      })

                      seekFontSize.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                              val size = 12 + progress
                              tvFontSizeLabel.text = "3. حجم خط الحديث في الويدجت: " + size
                              if (fromUser) saveAndApplyStyle()
                          }
                          override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                          override fun onStopTrackingTouch(seekBar: SeekBar?) = saveAndApplyStyle()
                      })

                      // --- إعدادات المؤقت ---
                      val intervalsLabels = arrayOf("كل ساعة", "كل 3 ساعات", "كل 6 ساعات", "كل 12 ساعة", "كل 24 ساعة")
                      val intervalsValues = longArrayOf(1L, 3L, 6L, 12L, 24L)

                      spinnerInterval.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, intervalsLabels)
                      val savedHours = HadithRepository.getIntervalHours(this)
                      spinnerInterval.setSelection(intervalsValues.indexOf(savedHours).takeIf { it >= 0 } ?: 2)

                      spinnerInterval.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                              val chosenHours = intervalsValues[position]
                              HadithRepository.setIntervalHours(this@MainActivity, chosenHours)
                              HadithUpdateWorker.schedulePeriodicUpdate(this@MainActivity, chosenHours)
                          }
                          override fun onNothingSelected(parent: AdapterView<*>?) {}
                      }
                  }

                  override fun onResume() {
                      super.onResume()
                      displayHadith(HadithRepository.getCurrentHadith(this))
                  }

                  private fun displayHadith(item: HadithItem) {
                      tvMatn.text = item.matn
                      tvMeta.text = "الراوي: " + item.rawi + "  |  المحدث: " + item.muhaddith + "\nالمصدر: " + item.source + "  •  خلاصة الحكم: " + item.grade
                      tvSharh.text = item.sharh
                  }

                  private fun refreshFavoritesUI() {
                      val favs = HadithRepository.getFavorites(this)
                      if (favs.isEmpty()) {
                          tvFavorites.text = "لا توجد أحاديث محفوظة حالياً."
                      } else {
                          tvFavorites.text = favs.joinToString("\n\n────────────\n\n") { "• " + it.matn + "\n(" + it.source + ")" }
                      }
                  }
              }
          """)
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-build-cache --rerun-tasks
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Dorar_Studio_V5.apk

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Dorar-Studio-V5-Package
          path: app/build/outputs/apk/debug/Dorar_Studio_V5.apk
