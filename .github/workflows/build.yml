          write_file("app/src/main/java/com/dorar/hadithwidget/HadithRepository.kt", r"""
              package com.dorar.hadithwidget

              import android.content.Context
              import com.google.gson.Gson
              import com.google.gson.reflect.TypeToken
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.withContext
              import org.jsoup.Jsoup

              data class HadithItem(
                  val matn: String,
                  val rawi: String,
                  val muhaddith: String,
                  val source: String,
                  val grade: String,
                  val sharh: String
              )

              object HadithRepository {
                  private const val PREFS_NAME = "dorar_hadith_prefs"
                  private const val KEY_CURRENT = "current_hadith"
                  private const val KEY_CACHE = "cached_hadiths"
                  private const val KEY_FAVORITES = "favorite_hadiths"
                  private const val KEY_INTERVAL = "update_interval_hours"

                  private val gson = Gson()

                  private val initialFallbackList = listOf(
                      HadithItem(
                          matn = "قال رسول الله ﷺ: «إنَّما الأعمالُ بالنِّيَّاتِ، وإنَّما لكلِّ امرئٍ ما نوى»",
                          rawi = "عمر بن الخطاب",
                          muhaddith = "البخاري",
                          source = "صحيح البخاري",
                          grade = "صحيح",
                          sharh = "يبين النبي ﷺ أن مدار قبول الأعمال وصحتها وترتب الثواب عليها إنما هو بالنية الصالحة وإخلاص العمل لله وحده."
                      ),
                      HadithItem(
                          matn = "قال رسول الله ﷺ: «الكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»",
                          rawi = "أبو هريرة",
                          muhaddith = "البخاري ومسلم",
                          source = "صحيح البخاري",
                          grade = "صحيح",
                          sharh = "كل كلام طيب يدخل السرور على قلب المؤمن أو يصلح بين الناس أو يذكر بالله فهو بمنزلة الصدقة بالمال في الأجر والثواب."
                      ),
                      HadithItem(
                          matn = "قال رسول الله ﷺ: «مَن كانَ يُؤْمِنُ باللَّهِ واليَومِ الآخِرِ فَلْيَقُلْ خَيْرًا أوْ لِيَصْمُتْ»",
                          rawi = "أبو هريرة",
                          muhaddith = "البخاري ومسلم",
                          source = "صحيح مسلم",
                          grade = "صحيح",
                          sharh = "دعوة لحفظ اللسان، فالمؤمن إما أن يتحدث بكلام فيه خير ومنفعة فيؤجر عليه، وإما أن يمسك لسانه ويسكت ليسلم من الإثم."
                      )
                  )

                  suspend fun fetchOnlineHadith(context: Context, searchQuery: String? = null): HadithItem = withContext(Dispatchers.IO) {
                      try {
                          val keywords = listOf("الصدق", "الرحمة", "الصبر", "الذكر", "الصلاة", "البر", "الخلق", "النية", "القلب", "الجنة", "التوبة")
                          val query = searchQuery ?: keywords.random()
                          val url = "https://dorar.net/hadith/search?q=" + java.net.URLEncoder.encode(query, "UTF-8") + "&st=w&xclude=&d%5B%5D=1&d%5B%5D=2"
                          val doc = Jsoup.connect(url)
                              .userAgent("Mozilla/5.0 (Linux; Android 14)")
                              .timeout(10000)
                              .get()

                          val elements = doc.select(".border-bottom")
                          val validList = mutableListOf<HadithItem>()

                          for (el in elements) {
                              val matnText = el.selectFirst(".hadith")?.text()?.trim() ?: continue
                              if (matnText.length in 25..350) {
                                  val infoText = el.selectFirst(".hadith-info")?.text() ?: ""
                                  val sharhLink = el.selectFirst("a[href*='/hadith/sharh/']")?.attr("href")
                                  var sharhText = "حديث صحيح ثابت في السنة النبوية، يحث على معالي الأخلاق والعمل الصالح."

                                  if (!sharhLink.isNullOrEmpty()) {
                                      try {
                                          val fullSharhUrl = if (sharhLink.startsWith("http")) sharhLink else "https://dorar.net$sharhLink"
                                          val sharhDoc = Jsoup.connect(fullSharhUrl).timeout(8000).get()
                                          val extractedSharh = sharhDoc.selectFirst(".text-justify")?.text()?.trim()
                                          if (!extractedSharh.isNullOrEmpty()) {
                                              sharhText = extractedSharh
                                          }
                                      } catch (_: Exception) {}
                                  }

                                  val item = HadithItem(
                                      matn = matnText,
                                      rawi = extractField(infoText, "الراوي:", "المحدث:"),
                                      muhaddith = extractField(infoText, "المحدث:", "المصدر:"),
                                      source = extractField(infoText, "المصدر:", "الصفحة أو الرقم:"),
                                      grade = "صحيح / حسن",
                                      sharh = sharhText
                                  )
                                  validList.add(item)
                              }
                          }

                          if (validList.isNotEmpty()) {
                              val chosen = validList.random()
                              saveCurrentHadith(context, chosen)
                              addToCache(context, chosen)
                              return@withContext chosen
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }

                      val cached = getCachedHadiths(context)
                      val fallback = if (cached.isNotEmpty()) cached.random() else initialFallbackList.random()
                      saveCurrentHadith(context, fallback)
                      return@withContext fallback
                  }

                  private fun extractField(text: String, startKey: String, endKey: String): String {
                      val start = text.indexOf(startKey)
                      if (start == -1) return "غير محدد"
                      val sub = text.substring(start + startKey.length)
                      val end = sub.indexOf(endKey)
                      return if (end != -1) sub.substring(0, end).trim() else sub.take(30).trim()
                  }

                  fun getCurrentHadith(context: Context): HadithItem {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val json = prefs.getString(KEY_CURRENT, null)
                      return if (json != null) {
                          gson.fromJson(json, HadithItem::class.java)
                      } else {
                          val first = initialFallbackList.first()
                          saveCurrentHadith(context, first)
                          first
                      }
                  }

                  fun saveCurrentHadith(context: Context, item: HadithItem) {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      prefs.edit().putString(KEY_CURRENT, gson.toJson(item)).apply()
                  }

                  private fun addToCache(context: Context, item: HadithItem) {
                      val list = getCachedHadiths(context).toMutableList()
                      list.removeAll { it.matn == item.matn }
                      list.add(0, item)
                      val trimmed = list.take(15)
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      prefs.edit().putString(KEY_CACHE, gson.toJson(trimmed)).apply()
                  }

                  fun getCachedHadiths(context: Context): List<HadithItem> {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val json = prefs.getString(KEY_CACHE, null) ?: return initialFallbackList
                      val type = object : TypeToken<List<HadithItem>>() {}.type
                      return gson.fromJson(json, type)
                  }

                  fun addFavorite(context: Context, item: HadithItem) {
                      val list = getFavorites(context).toMutableList()
                      if (list.none { it.matn == item.matn }) {
                          list.add(0, item)
                          val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          prefs.edit().putString(KEY_FAVORITES, gson.toJson(list)).apply()
                      }
                  }

                  fun getFavorites(context: Context): List<HadithItem> {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val json = prefs.getString(KEY_FAVORITES, null) ?: return emptyList()
                      val type = object : TypeToken<List<HadithItem>>() {}.type
                      return gson.fromJson(json, type)
                  }

                  fun setIntervalHours(context: Context, hours: Long) {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      prefs.edit().putLong(KEY_INTERVAL, hours).apply()
                  }

                  fun getIntervalHours(context: Context): Long {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      return prefs.getLong(KEY_INTERVAL, 6L)
                  }
              }
          """)

          write_file("app/src/main/java/com/dorar/hadithwidget/HadithUpdateWorker.kt", r"""
              package com.dorar.hadithwidget

              import android.content.Context
              import androidx.work.CoroutineWorker
              import androidx.work.ExistingPeriodicWorkPolicy
              import androidx.work.PeriodicWorkRequestBuilder
              import androidx.work.WorkManager
              import androidx.work.WorkerParameters
              import java.util.concurrent.TimeUnit

              class HadithUpdateWorker(
                  private val appContext: Context,
                  workerParams: WorkerParameters
              ) : CoroutineWorker(appContext, workerParams) {

                  override suspend fun doWork(): Result {
                      HadithRepository.fetchOnlineHadith(appContext)
                      HadithWidgetProvider.updateAllWidgets(appContext)
                      return Result.success()
                  }

                  companion object {
                      private const val WORK_NAME = "dorar_hadith_periodic_work"

                      fun schedulePeriodicUpdate(context: Context, hours: Long) {
                          val request = PeriodicWorkRequestBuilder<HadithUpdateWorker>(hours, TimeUnit.HOURS)
                              .build()
                          WorkManager.getInstance(context).enqueueUniquePeriodicWork(
                              WORK_NAME,
                              ExistingPeriodicWorkPolicy.UPDATE,
                              request
                          )
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/dorar/hadithwidget/HadithWidgetProvider.kt", r"""
              package com.dorar.hadithwidget

              import android.app.PendingIntent
              import android.appwidget.AppWidgetManager
              import android.appwidget.AppWidgetProvider
              import android.content.ComponentName
              import android.content.Context
              import android.content.Intent
              import android.widget.RemoteViews
              import kotlinx.coroutines.CoroutineScope
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.launch

              class HadithWidgetProvider : AppWidgetProvider() {

                  override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                      for (appWidgetId in appWidgetIds) {
                          updateAppWidget(context, appWidgetManager, appWidgetId)
                      }
                  }

                  override fun onReceive(context: Context, intent: Intent) {
                      super.onReceive(context, intent)
                      if (intent.action == ACTION_REFRESH) {
                          val pendingResult = goAsync()
                          CoroutineScope(Dispatchers.IO).launch {
                              try {
                                  HadithRepository.fetchOnlineHadith(context)
                                  updateAllWidgets(context)
                              } finally {
                                  pendingResult.finish()
                              }
                          }
                      }
                  }

                  companion object {
                      const val ACTION_REFRESH = "com.dorar.hadithwidget.ACTION_REFRESH"

                      fun updateAllWidgets(context: Context) {
                          val manager = AppWidgetManager.getInstance(context)
                          val ids = manager.getAppWidgetIds(ComponentName(context, HadithWidgetProvider::class.java))
                          for (id in ids) {
                              updateAppWidget(context, manager, id)
                          }
                      }

                      fun updateAppWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                          val hadith = HadithRepository.getCurrentHadith(context)
                          val views = RemoteViews(context.packageName, R.layout.widget_hadith)

                          views.setTextViewText(R.id.tv_widget_matn, hadith.matn)
                          views.setTextViewText(
                              R.id.tv_widget_footer,
                              "الراوي: " + hadith.rawi + " | " + hadith.source + " (اضغط للشرح)"
                          )

                          val openAppIntent = Intent(context, MainActivity::class.java)
                          val openAppPending = PendingIntent.getActivity(
                              context, 0, openAppIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(R.id.widget_root, openAppPending)
                          views.setOnClickPendingIntent(R.id.tv_widget_matn, openAppPending)

                          val refreshIntent = Intent(context, HadithWidgetProvider::class.java).apply {
                              action = ACTION_REFRESH
                          }
                          val refreshPending = PendingIntent.getBroadcast(
                              context, 1, refreshIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(R.id.btn_widget_refresh, refreshPending)

                          val shareText = hadith.matn + "\n\nالراوي: " + hadith.rawi + " | المصدر: " + hadith.source + "\n\nالشرح: " + hadith.sharh
                          val shareIntent = Intent(Intent.ACTION_SEND).apply {
                              type = "text/plain"
                              putExtra(Intent.EXTRA_TEXT, shareText)
                          }
                          val chooser = Intent.createChooser(shareIntent, "مشاركة الحديث النبوي")
                          val sharePending = PendingIntent.getActivity(
                              context, 2, chooser,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(R.id.btn_widget_share, sharePending)

                          appWidgetManager.updateAppWidget(appWidgetId, views)
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/dorar/hadithwidget/MainActivity.kt", r"""
              package com.dorar.hadithwidget

              import android.os.Bundle
              import android.view.View
              import android.widget.*
              import androidx.appcompat.app.AppCompatActivity
              import androidx.lifecycle.lifecycleScope
              import kotlinx.coroutines.launch

              class MainActivity : AppCompatActivity() {

                  private lateinit var tvMatn: TextView
                  private lateinit var tvMeta: TextView
                  private lateinit var tvSharh: TextView
                  private lateinit var tvFavorites: TextView
                  private lateinit var etSearch: EditText

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      setContentView(R.layout.activity_main)

                      tvMatn = findViewById(R.id.tv_main_matn)
                      tvMeta = findViewById(R.id.tv_main_meta)
                      tvSharh = findViewById(R.id.tv_main_sharh)
                      tvFavorites = findViewById(R.id.tv_favorites_list)
                      etSearch = findViewById(R.id.et_search)

                      val btnNewHadith: Button = findViewById(R.id.btn_new_hadith)
                      val btnAddFav: Button = findViewById(R.id.btn_add_fav)
                      val btnSearch: Button = findViewById(R.id.btn_search)
                      val spinnerInterval: Spinner = findViewById(R.id.spinner_interval)

                      displayHadith(HadithRepository.getCurrentHadith(this))
                      refreshFavoritesUI()

                      btnNewHadith.setOnClickListener {
                          Toast.makeText(this, "جاري جلب حديث صحيح وشرحه من الدرر السنية...", Toast.LENGTH_SHORT).show()
                          lifecycleScope.launch {
                              val item = HadithRepository.fetchOnlineHadith(this@MainActivity)
                              displayHadith(item)
                              HadithWidgetProvider.updateAllWidgets(this@MainActivity)
                          }
                      }

                      btnSearch.setOnClickListener {
                          val q = etSearch.text.toString().trim()
                          if (q.isNotEmpty()) {
                              Toast.makeText(this, "جاري البحث في الموسوعة الحديثية...", Toast.LENGTH_SHORT).show()
                              lifecycleScope.launch {
                                  val item = HadithRepository.fetchOnlineHadith(this@MainActivity, q)
                                  displayHadith(item)
                                  HadithWidgetProvider.updateAllWidgets(this@MainActivity)
                              }
                          }
                      }

                      btnAddFav.setOnClickListener {
                          val current = HadithRepository.getCurrentHadith(this)
                          HadithRepository.addFavorite(this, current)
                          refreshFavoritesUI()
                          Toast.makeText(this, "تم حفظ الحديث في المفضلة ⭐", Toast.LENGTH_SHORT).show()
                      }

                      val intervalsLabels = arrayOf("كل ساعة", "كل 3 ساعات", "كل 6 ساعات", "كل 12 ساعة", "كل 24 ساعة")
                      val intervalsValues = longArrayOf(1L, 3L, 6L, 12L, 24L)

                      val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, intervalsLabels)
                      spinnerInterval.adapter = adapter

                      val savedHours = HadithRepository.getIntervalHours(this)
                      val initialIndex = intervalsValues.indexOf(savedHours).takeIf { it >= 0 } ?: 2
                      spinnerInterval.setSelection(initialIndex)

                      spinnerInterval.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                              val chosenHours = intervalsValues[position]
                              HadithRepository.setIntervalHours(this@MainActivity, chosenHours)
                              HadithUpdateWorker.schedulePeriodicUpdate(this@MainActivity, chosenHours)
                          }
                          override fun onNothingSelected(parent: AdapterView<*>?) {}
                      }
                  }

                  private fun displayHadith(item: HadithItem) {
                      tvMatn.text = item.matn
                      tvMeta.text = "الراوي: " + item.rawi + " | المحدث: " + item.muhaddith + " | المصدر: " + item.source + " (" + item.grade + ")"
                      tvSharh.text = item.sharh
                  }

                  private fun refreshFavoritesUI() {
                      val favs = HadithRepository.getFavorites(this)
                      if (favs.isEmpty()) {
                          tvFavorites.text = "لا توجد أحاديث محفوظة حالياً."
                      } else {
                          tvFavorites.text = favs.joinToString("\n\n────────────\n\n") { "• " + it.matn + "\n(" + it.source + ")" }
                      }
                  }
              }
          """)
