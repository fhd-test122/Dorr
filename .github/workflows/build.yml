name: Auto Generate and Build Dorar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/dorar/hadithwidget
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/font

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DorarHadithApp"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dorar.hadithwidget"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.dorar.hadithwidget"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.work:work-runtime-ktx:2.9.0")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.dorar.hadithwidget">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="أحاديث الدرر السنية"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.DorarHadith">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".HadithWidgetProvider"
                      android:exported="true"
                      android:label="ويدجت الموسوعة الحديثية">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.dorar.hadithwidget.ACTION_REFRESH" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/hadith_widget_info" />
                  </receiver>

                  <meta-data
                      android:name="preloaded_fonts"
                      android:resource="@array/preloaded_fonts" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_glass_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="135"
                  android:startColor="#CC1E293B"
                  android:centerColor="#B30F172A"
                  android:endColor="#991E293B"
                  android:type="linear" />
              <corners android:radius="24dp" />
              <stroke
                  android:width="1.5dp"
                  android:color="#4DFFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_glass_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#26FFFFFF" />
              <corners android:radius="18dp" />
              <stroke
                  android:width="1dp"
                  android:color="#33FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/xml/hadith_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="140dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="3600000"
              android:initialLayout="@layout/widget_hadith"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.DorarHadith" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#0284C7</item>
                  <item name="colorPrimaryVariant">#0369A1</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="android:fontFamily">@font/cairo</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/preloaded_fonts.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <array name="preloaded_fonts" translatable="false">
                  <item>@font/cairo</item>
              </array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/font/cairo.xml
          <?xml version="1.0" encoding="utf-8"?>
          <font-family xmlns:app="http://schemas.android.com/apk/res-auto"
              app:fontProviderAuthority="com.google.android.gms.fonts"
              app:fontProviderPackage="com.google.android.gms"
              app:fontProviderQuery="Cairo"
              app:fontProviderCerts="@array/com_google_android_gms_fonts_certs">
          </font-family>
          EOF

          cat << 'EOF' > app/src/main/res/values/font_certs.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <array name="com_google_android_gms_fonts_certs">
                  <item>@array/com_google_android_gms_fonts_certs_dev</item>
                  <item>@array/com_google_android_gms_fonts_certs_prod</item>
              </array>
              <string-array name="com_google_android_gms_fonts_certs_dev">
                  <item></item>
              </string-array>
              <string-array name="com_google_android_gms_fonts_certs_prod">
                  <item></item>
              </string-array>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/widget_hadith.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bg_glass_widget"
              android:padding="16dp"
              android:layoutDirection="rtl">

              <LinearLayout
                  android:id="@+id/widget_header"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">

                  <TextView
                      android:id="@+id/tv_widget_badge"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="الموسوعة الحديثية • حديث صحيح"
                      android:textColor="#38BDF8"
                      android:textSize="12sp"
                      android:fontFamily="@font/cairo"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/btn_widget_share"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="مشاركة 📤"
                      android:textColor="#E2E8F0"
                      android:textSize="12sp"
                      android:fontFamily="@font/cairo"
                      android:paddingHorizontal="8dp"
                      android:paddingVertical="4dp" />

                  <TextView
                      android:id="@+id/btn_widget_refresh"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="تحديث 🔄"
                      android:textColor="#38BDF8"
                      android:textSize="12sp"
                      android:fontFamily="@font/cairo"
                      android:paddingHorizontal="8dp"
                      android:paddingVertical="4dp" />
              </LinearLayout>

              <TextView
                  android:id="@+id/tv_widget_matn"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_below="@id/widget_header"
                  android:layout_above="@+id/tv_widget_footer"
                  android:layout_marginTop="8dp"
                  android:layout_marginBottom="8dp"
                  android:gravity="center_vertical"
                  android:maxLines="5"
                  android:ellipsize="end"
                  android:text="قال رسول الله ﷺ: (إنَّما الأعمالُ بالنِّيَّاتِ، وإنَّما لكلِّ امرئٍ ما نوى...)"
                  android:textColor="#FFFFFF"
                  android:textSize="15sp"
                  android:lineSpacingExtra="4dp"
                  android:fontFamily="@font/cairo" />

              <TextView
                  android:id="@+id/tv_widget_footer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:text="الراوي: عمر بن الخطاب | المصدر: صحيح البخاري (اضغط للشرح)"
                  android:textColor="#94A3B8"
                  android:textSize="11sp"
                  android:singleLine="true"
                  android:ellipsize="end"
                  android:fontFamily="@font/cairo" />
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:layoutDirection="rtl"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="الموسوعة الحديثية - الدرر السنية"
                      android:textColor="#38BDF8"
                      android:textSize="22sp"
                      android:textStyle="bold"
                      android:fontFamily="@font/cairo"
                      android:layout_marginBottom="12dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="@drawable/bg_glass_card"
                      android:orientation="horizontal"
                      android:padding="8dp"
                      android:layout_marginBottom="16dp">

                      <EditText
                          android:id="@+id/et_search"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:hint="ابحث عن حديث في الدرر السنية..."
                          android:textColorHint="#94A3B8"
                          android:textColor="#FFFFFF"
                          android:background="@android:color/transparent"
                          android:fontFamily="@font/cairo"
                          android:padding="8dp" />

                      <Button
                          android:id="@+id/btn_search"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="بحث"
                          android:fontFamily="@font/cairo" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="@drawable/bg_glass_widget"
                      android:orientation="vertical"
                      android:padding="16dp"
                      android:layout_marginBottom="16dp">

                      <TextView
                          android:id="@+id/tv_main_matn"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="#FFFFFF"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:fontFamily="@font/cairo"
                          android:lineSpacingExtra="6dp"
                          android:layout_marginBottom="12dp" />

                      <TextView
                          android:id="@+id/tv_main_meta"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="#38BDF8"
                          android:textSize="13sp"
                          android:fontFamily="@font/cairo"
                          android:layout_marginBottom="12dp" />

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:background="#33FFFFFF"
                          android:layout_marginBottom="12dp" />

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="📖 شرح الحديث ومعاني الكلمات:"
                          android:textColor="#FACC15"
                          android:textSize="15sp"
                          android:textStyle="bold"
                          android:fontFamily="@font/cairo"
                          android:layout_marginBottom="6dp" />

                      <TextView
                          android:id="@+id/tv_main_sharh"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="#E2E8F0"
                          android:textSize="15sp"
                          android:lineSpacingExtra="6dp"
                          android:fontFamily="@font/cairo" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:layout_marginTop="16dp">

                          <Button
                              android:id="@+id/btn_new_hadith"
                              android:layout_width="0dp"
                              android:layout_he
