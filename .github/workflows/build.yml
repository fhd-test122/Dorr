name: Build Dorar Studio V5

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean and Generate Studio V5 Project
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          python3 - << 'PYEOF'
          import os, textwrap

          dirs = [
              "app/src/main/java/com/dorar/studiov5",
              "app/src/main/res/layout",
              "app/src/main/res/drawable",
              "app/src/main/res/xml",
              "app/src/main/res/values"
          ]
          for d in dirs:
              os.makedirs(d, exist_ok=True)

          def write_file(path, content):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          write_file("settings.gradle.kts", r"""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "DorarStudioV5"
              include(":app")
          """)

          write_file("build.gradle.kts", r"""
              plugins {
                  id("com.android.application") version "8.2.2" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              }
          """)

          write_file("gradle.properties", r"""
              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              kotlin.code.style=official
              android.nonTransitiveRClass=true
          """)

          write_file("app/build.gradle.kts", r"""
              plugins {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
              }

              android {
                  namespace = "com.dorar.studiov5"
                  compileSdk = 34

                  defaultConfig {
                      applicationId = "com.dorar.studiov5"
                      minSdk = 26
                      targetSdk = 34
                      versionCode = 5
                      versionName = "5.0-Studio"
                  }

                  buildTypes {
                      release {
                          isMinifyEnabled = false
                      }
                  }
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }

              dependencies {
                  implementation("androidx.core:core-ktx:1.12.0")
                  implementation("androidx.appcompat:appcompat:1.6.1")
                  implementation("com.google.android.material:material:1.11.0")
                  implementation("androidx.constraintlayout:constraintlayout:2.1.4")
                  implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
                  implementation("androidx.work:work-runtime-ktx:2.9.0")
                  implementation("org.jsoup:jsoup:1.17.2")
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
                  implementation("com.google.code.gson:gson:2.10.1")
              }
          """)

          write_file("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

                  <application
                      android:allowBackup="false"
                      android:label="أحاديث الدرر السنية"
                      android:supportsRtl="true"
                      android:usesCleartextTraffic="true"
                      android:theme="@style/Theme.DorarHadith">

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:launchMode="singleTop">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>

                      <receiver
                          android:name=".HadithWidgetProvider"
                          android:exported="true"
                          android:label="ويدجت الحديث البسيط">
                          <intent-filter>
                              <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                              <action android:name="com.dorar.studiov5.ACTION_REFRESH" />
                          </intent-filter>
                          <meta-data
                              android:name="android.appwidget.provider"
                              android:resource="@xml/hadith_widget_info" />
                      </receiver>
                  </application>

              </manifest>
          """)

          write_file("app/src/main/res/drawable/bg_glass_card.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <shape xmlns:android="http://schemas.android.com/apk/res/android"
                  android:shape="rectangle">
                  <solid android:color="#1E293B" />
                  <corners android:radius="20dp" />
                  <stroke
                      android:width="1dp"
                      android:color="#33FFFFFF" />
              </shape>
          """)

          write_file("app/src/main/res/drawable/bg_footer_pill.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <shape xmlns:android="http://schemas.android.com/apk/res/android"
                  android:shape="rectangle">
                  <solid android:color="#0F172A" />
                  <corners android:radius="14dp" />
                  <stroke
                      android:width="1dp"
                      android:color="#3338BDF8" />
              </shape>
          """)

          write_file("app/src/main/res/drawable/ic_refresh_vec.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="20dp"
                  android:height="20dp"
                  android:viewportWidth="24"
                  android:viewportHeight="24">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z" />
              </vector>
          """)

          write_file("app/src/main/res/xml/hadith_widget_info.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
                  android:minWidth="250dp"
                  android:minHeight="110dp"
                  android:updatePeriodMillis="3600000"
                  android:initialLayout="@layout/widget_hadith"
                  android:resizeMode="horizontal|vertical"
                  android:widgetCategory="home_screen" />
          """)

          write_file("app/src/main/res/values/styles.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <style name="Theme.DorarHadith" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                      <item name="colorPrimary">#38BDF8</item>
                      <item name="colorPrimaryVariant">#0284C7</item>
                      <item name="colorOnPrimary">#0F172A</item>
                      <item name="android:statusBarColor">#090D16</item>
                  </style>
              </resources>
          """)

          # --- تصميم الويدجت البسيط والنقي (الحديث + زر التحديث فقط) ---
          write_file("app/src/main/res/layout/widget_hadith.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
                  android:id="@+id/widget_root"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layoutDirection="rtl">

                  <!-- صورة الخلفية الديناميكية التي يتغير لونها وشفافيتها برمجياً بحواف دائرية -->
                  <ImageView
                      android:id="@+id/iv_widget_bg"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:scaleType="fitXY" />

                  <!-- زر التحديث الصغير الأنيق في الزاوية فقط -->
                  <ImageButton
                      android:id="@+id/btn_widget_refresh"
                      android:layout_width="32dp"
                      android:layout_height="32dp"
                      android:layout_alignParentTop="true"
                      android:layout_alignParentEnd="true"
                      android:layout_marginTop="10dp"
                      android:layout_marginEnd="10dp"
                      android:background="@android:color/transparent"
                      android:src="@drawable/ic_refresh_vec"
                      android:scaleType="centerInside"
                      android:alpha="0.75"
                      android:contentDescription="تحديث الحديث" />

                  <!-- نص الحديث النبوي فقط في منتصف الويدجت -->
                  <TextView
                      android:id="@+id/tv_widget_matn"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:layout_toStartOf="@id/btn_widget_refresh"
                      android:paddingStart="18dp"
                      android:paddingEnd="8dp"
                      android:paddingVertical="14dp"
                      android:gravity="center"
                      android:maxLines="6"
                      android:ellipsize="end"
                      android:text="قال رسول الله ﷺ: «الكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:lineSpacingExtra="5dp" />

              </RelativeLayout>
          """)

          # --- تصميم شاشة التطبيق مع استوديو تخصيص الويدجت ---
          write_file("app/src/main/res/layout/activity_main.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#090D16"
                  android:layoutDirection="rtl"
                  android:padding="16dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="موسوعة الدرر السنية"
                          android:textColor="#38BDF8"
                          android:textSize="23sp"
                          android:textStyle="bold"
                          android:layout_marginBottom="4dp" />

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="اضغط على الويدجت في أي وقت لقراءة الشرح والراوي والمصدر هنا"
                          android:textColor="#94A3B8"
                          android:textSize="12sp"
                          android:layout_marginBottom="16dp" />

                      <!-- شريط البحث -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/bg_glass_card"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:paddingHorizontal="12dp"
                          android:paddingVertical="6dp"
                          android:layout_marginBottom="16dp">

                          <EditText
                              android:id="@+id/et_search"
                              android:layout_width="0dp"
                              android:layout_height="44dp"
                              android:layout_weight="1"
                              android:hint="ابحث في الموسوعة (مثل: الصبر، الصلاة، البر)..."
                              android:textColorHint="#94A3B8"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:background="@android:color/transparent"
                              android:paddingHorizontal="8dp" />

                          <Button
                              android:id="@+id/btn_search"
                              android:layout_width="wrap_content"
                              android:layout_height="42dp"
                              android:text="بحث"
                              android:backgroundTint="#38BDF8"
                              android:textColor="#090D16"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <!-- بطاقة الحديث الكاملة (النص + الراوي + المصدر + الشرح + المشاركة) -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/bg_glass_card"
                          android:orientation="vertical"
                          android:padding="20dp"
                          android:layout_marginBottom="16dp">

                          <TextView
                              android:id="@+id/tv_main_matn"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:textSize="19sp"
                              android:textStyle="bold"
                              android:lineSpacingExtra="7dp"
                              android:layout_marginBottom="14dp" />

                          <TextView
                              android:id="@+id/tv_main_meta"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:background="@drawable/bg_footer_pill"
                              android:padding="12dp"
                              android:textColor="#38BDF8"
                              android:textSize="13sp"
                              android:lineSpacingExtra="4dp"
                              android:layout_marginBottom="16dp" />

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="📖 شرح الحديث ومعاني الكلمات:"
                              android:textColor="#FACC15"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:layout_marginBottom="8dp" />

                          <TextView
                              android:id="@+id/tv_main_sharh"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#E2E8F0"
                              android:textSize="15sp"
                              android:lineSpacingExtra="7dp" />

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:layout_marginTop="18dp">

                              <Button
                                  android:id="@+id/btn_new_hadith"
                                  android:layout_width="0dp"
                                  android:layout_height="48dp"
                                  android:layout_weight="1"
                                  android:text="حديث جديد ↻"
                                  android:backgroundTint="#38BDF8"
                                  android:textColor="#090D16"
                                  android:textStyle="bold"
                                  android:layout_marginEnd="6dp" />

                              <Button
                                  android:id="@+id/btn_share_main"
                                  android:layout_width="0dp"
                                  android:layout_height="48dp"
                                  android:layout_weight="1"
                                  android:text="مشاركة 📤"
                                  android:backgroundTint="#334155"
                                  android:textColor="#FFFFFF"
                                  android:textStyle="bold"
                                  android:layout_marginEnd="6dp" />

                              <Button
                                  android:id="@+id/btn_add_fav"
                                  android:layout_width="0dp"
                                  android:layout_height="48dp"
                                  android:layout_weight="1"
                                  android:text="للمفضلة ★"
                                  android:backgroundTint="#FACC15"
                                  android:textColor="#090D16"
                                  android:textStyle="bold" />
                          </LinearLayout>
                      </LinearLayout>

                      <!-- 🎨 استوديو تخصيص مظهر الويدجت (اللون، الشفافية، حجم الخط، لون الخط) -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/bg_glass_card"
                          android:orientation="vertical"
                          android:padding="18dp"
                          android:layout_marginBottom="16dp">

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="🎨 استوديو تخصيص الويدجت (يتحدث فوراً):"
                              android:textColor="#FACC15"
                              android:textSize="17sp"
                              android:textStyle="bold"
                              android:layout_marginBottom="14dp" />

                          <!-- 1. لون خلفية الويدجت -->
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="1. اختر لون خلفية الويدجت:"
                              android:textColor="#E2E8F0"
                              android:textSize="14sp"
                              android:layout_marginBottom="6dp" />

                          <Spinner
                              android:id="@+id/spinner_bg_color"
                              android:layout_width="match_parent"
                              android:layout_height="46dp"
                              android:background="#E2E8F0"
                              android:paddingHorizontal="12dp"
                              android:layout_marginBottom="14dp" />

                          <!-- 2. درجة شفافية الويدجت -->
                          <TextView
                              android:id="@+id/tv_opacity_label"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="2. درجة التعتيم / الشفافية: 85%"
                              android:textColor="#E2E8F0"
                              android:textSize="14sp"
                              android:layout_marginBottom="4dp" />

                          <SeekBar
                              android:id="@+id/seek_opacity"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:max="100"
                              android:progress="85"
                              android:layout_marginBottom="14dp" />

                          <!-- 3. حجم خط الحديث في الويدجت -->
                          <TextView
                              android:id="@+id/tv_fontsize_label"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="3. حجم خط الحديث في الويدجت: 16"
                              android:textColor="#E2E8F0"
                              android:textSize="14sp"
                              android:layout_marginBottom="4dp" />

                          <SeekBar
                              android:id="@+id/seek_fontsize"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:max="14"
                              android:progress="4"
                              android:layout_marginBottom="14dp" />

                          <!-- 4. لون الخط في الويدجت -->
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="4. اختر لون خط الحديث:"
                              android:textColor="#E2E8F0"
                              android:textSize="14sp"
                              android:layout_marginBottom="6dp" />

                          <Spinner
                              android:id="@+id/spinner_text_color"
                              android:layout_width="match_parent"
                              android:layout_height="46dp"
                              android:background="#E2E8F0"
                              android:paddingHorizontal="12dp" />
                      </LinearLayout>

                      <!-- إعدادات مؤقت التحديث -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/bg_glass_card"
                          android:orientation="vertical"
                          android:padding="16dp"
                          android:layout_marginBottom="16dp">

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="⏱️ الفترة الزمنية لتغيير الحديث تلقائياً:"
                              android:textColor="#FFFFFF"
                              android:textSize="15sp"
                              android:textStyle="bold"
                              android:layout_marginBottom="10dp" />

                          <Spinner
                              android:id="@+id/spinner_interval"
                              android:layout_width="match_parent"
                              android:layout_height="46dp"
                              android:background="#E2E8F0"
                              android:paddingHorizontal="12dp" />
                      </LinearLayout>

                      <!-- قسم المفضلة -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/bg_glass_card"
                          android:orientation="vertical"
                          android:padding="16dp">

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="★ الأحاديث المحفوظة في المفضلة:"
                              android:textColor="#FACC15"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:layout_marginBottom="10dp" />

                          <TextView
                              android:id="@+id/tv_favorites_list"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="لا توجد أحاديث محفوظة حالياً."
                              android:textColor="#CBD5E1"
                              android:textSize="14sp"
                              android:lineSpacingExtra="5dp" />
                      </LinearLayout>

                  </LinearLayout>
              </ScrollView>
          """)

          write_file("app/src/main/java/com/dorar/studiov5/HadithRepository.kt", r"""
              package com.dorar.studiov5

              import android.content.Context
              import com.google.gson.Gson
              import com.google.gson.reflect.TypeToken
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.withContext
              import org.json.JSONObject
              import org.jsoup.Jsoup
              import java.net.HttpURLConnection
              import java.net.URL
              import java.net.URLEncoder
              import kotlin.random.Random

              data class HadithItem(
                  val matn: String,
                  val rawi: String,
                  val muhaddith: String,
                  val source: String,
                  val grade: String,
                  val sharh: String
              )

              data class WidgetStyleConfig(
                  val bgColorHex: String = "#0F172A",
                  val opacityPercent: Int = 85,
                  val fontSizeSp: Float = 16f,
                  val textColorHex: String = "#FFFFFF"
              )

              object HadithRepository {
                  private const val PREFS_NAME = "dorar_studio_v5_prefs"
                  private const val KEY_CURRENT = "current_hadith"
                  private const val KEY_CACHE = "cached_hadiths"
                  private const val KEY_FAVORITES = "favorite_hadiths"
                  private const val KEY_INTERVAL = "update_interval_hours"
                  private const val KEY_STYLE = "widget_style_config"

                  private val gson = Gson()

                  private val richFallbackList = listOf(
                      HadithItem("قال رسول الله ﷺ: «الكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»", "أبو هريرة", "البخاري ومسلم", "صحيح البخاري", "صحيح", "كل كلام طيب يدخل السرور على قلب المؤمن أو يصلح بين الناس أو يذكر بالله فهو بمنزلة الصدقة بالمال في الأجر والثواب."),
                      HadithItem("قال رسول الله ﷺ: «إنَّما الأعمالُ بالنِّيَّاتِ، وإنَّما لكلِّ امرئٍ ما نوى»", "عمر بن الخطاب", "البخاري", "صحيح البخاري", "صحيح", "يبين النبي ﷺ أن مدار قبول الأعمال وصحتها وترتب الثواب عليها إنما هو بالنية الصالحة وإخلاص العمل لله وحده."),
