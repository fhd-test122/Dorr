                  )

                  suspend fun fetchOnlineHadith(context: Context, searchQuery: String? = null): HadithItem = withContext(Dispatchers.IO) {
                      val currentMatn = getCurrentHadith(context).matn

                      try {
                          val keywords = listOf(
                              "الصدق", "الرحمة", "الصبر", "الذكر", "الصلاة", "البر", "الخلق", "النية",
                              "القلب", "الجنة", "التوبة", "الصدقة", "العفو", "التواضع", "الإحسان", "الاستغفار",
                              "الوالدين", "الرزق", "الدعاء", "القرآن", "الحياء", "الأمانة", "الرفق", "الشكر"
                          )
                          val query = searchQuery?.takeIf { it.isNotBlank() } ?: keywords.random()
                          val randomPage = if (searchQuery.isNullOrBlank()) Random.nextInt(1, 5) else 1
                          val apiUrl = "https://dorar.net/dorar_api.json?skey=" + URLEncoder.encode(query, "UTF-8") + "&d%5B%5D=1&d%5B%5D=2&page=$randomPage"

                          val conn = URL(apiUrl).openConnection() as HttpURLConnection
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Android 14; Mobile)")
                          conn.connectTimeout = 8000
                          conn.readTimeout = 8000

                          val rawResponse = conn.inputStream.bufferedReader().use { it.readText() }.trim()
                          val jsonStr = rawResponse.removePrefix("callback(").removeSuffix(")").removeSuffix(";")
                          val htmlContent = JSONObject(jsonStr).getJSONObject("ahadith").getString("result")

                          val doc = Jsoup.parse(htmlContent)
                          val hadithElements = doc.select(".hadith")
                          val infoElements = doc.select(".hadith-info")

                          val validItems = mutableListOf<HadithItem>()
                          for (i in 0 until minOf(hadithElements.size, infoElements.size)) {
                              val cleanMatn = hadithElements[i].text().trim().replace(Regex("^[0-9\\s\\-]+"), "")
                              if (cleanMatn.length in 25..340 && cleanMatn != currentMatn) {
                                  val info = infoElements[i].text()
                                  val rawi = extractField(info, "الراوي:", "المحدث:")
                                  val muhaddith = extractField(info, "المحدث:", "المصدر:")
                                  val source = extractField(info, "المصدر:", "الصفحة أو الرقم:")
                                  val grade = extractField(info, "خلاصة حكم المحدث:", "")

                                  if (!grade.contains("ضعيف") && !grade.contains("موضوع")) {
                                      validItems.add(
                                          HadithItem(
                                              matn = "قال رسول الله ﷺ: «$cleanMatn»",
                                              rawi = rawi,
                                              muhaddith = muhaddith,
                                              source = source,
                                              grade = grade.ifEmpty { "صحيح" },
                                              sharh = "📚 توثيق الحديث من الموسوعة الحديثية (الدرر السنية):\n• الراوي: $rawi\n• المحدث: $muhaddith\n• المصدر: $source\n• خلاصة الحكم: $grade\n\n💡 الفائدة والتوجيه النبوي: يرشدنا هذا الحديث الشريف إلى عظيم هدي النبي ﷺ في تزكية النفوس والتحلي بمكارم الأخلاق وصالح الأعمال."
                                          )
                                      )
                                  }
                              }
                          }

                          if (validItems.isNotEmpty()) {
                              val chosen = validItems.random()
                              saveCurrentHadith(context, chosen)
                              addToCache(context, chosen)
                              return@withContext chosen
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }

                      val pool = (getCachedHadiths(context) + richFallbackList).distinctBy { it.matn }.filter { it.matn != currentMatn }
                      val fallback = if (pool.isNotEmpty()) pool.random() else richFallbackList.random()
                      saveCurrentHadith(context, fallback)
                      return@withContext fallback
                  }

                  private fun extractField(text: String, startKey: String, endKey: String): String {
                      val start = text.indexOf(startKey)
                      if (start == -1) return "غير محدد"
                      val sub = text.substring(start + startKey.length)
                      if (endKey.isEmpty()) return sub.take(35).trim()
                      val end = sub.indexOf(endKey)
                      return if (end != -1) sub.substring(0, end).trim() else sub.take(35).trim()
                  }

                  fun getCurrentHadith(context: Context): HadithItem {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val json = prefs.getString(KEY_CURRENT, null)
                      return if (json != null) {
                          gson.fromJson(json, HadithItem::class.java)
                      } else {
                          val first = richFallbackList.random()
                          saveCurrentHadith(context, first)
                          first
                      }
                  }

                  fun saveCurrentHadith(context: Context, item: HadithItem) {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      prefs.edit().putString(KEY_CURRENT, gson.toJson(item)).apply()
                  }

                  private fun addToCache(context: Context, item: HadithItem) {
                      val list = getCachedHadiths(context).toMutableList()
                      list.removeAll { it.matn == item.matn }
                      list.add(0, item)
                      val trimmed = list.take(30)
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      prefs.edit().putString(KEY_CACHE, gson.toJson(trimmed)).apply()
                  }

                  fun getCachedHadiths(context: Context): List<HadithItem> {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val json = prefs.getString(KEY_CACHE, null) ?: return richFallbackList
                      val type = object : TypeToken<List<HadithItem>>() {}.type
                      return gson.fromJson(json, type)
                  }

                  fun addFavorite(context: Context, item: HadithItem) {
                      val list = getFavorites(context).toMutableList()
                      if (list.none { it.matn == item.matn }) {
                          list.add(0, item)
                          val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          prefs.edit().putString(KEY_FAVORITES, gson.toJson(list)).apply()
                      }
                  }

                  fun getFavorites(context: Context): List<HadithItem> {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val json = prefs.getString(KEY_FAVORITES, null) ?: return emptyList()
                      val type = object : TypeToken<List<HadithItem>>() {}.type
                      return gson.fromJson(json, type)
                  }

                  fun setIntervalHours(context: Context, hours: Long) {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      prefs.edit().putLong(KEY_INTERVAL, hours).apply()
                  }

                  fun getIntervalHours(context: Context): Long {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      return prefs.getLong(KEY_INTERVAL, 6L)
                  }

                  fun saveWidgetStyle(context: Context, style: WidgetStyleConfig) {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      prefs.edit().putString(KEY_STYLE, gson.toJson(style)).apply()
                  }

                  fun getWidgetStyle(context: Context): WidgetStyleConfig {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val json = prefs.getString(KEY_STYLE, null)
                      return if (json != null) {
                          gson.fromJson(json, WidgetStyleConfig::class.java)
                      } else {
                          WidgetStyleConfig()
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/dorar/studiov5/HadithUpdateWorker.kt", r"""
              package com.dorar.studiov5

              import android.content.Context
              import androidx.work.CoroutineWorker
              import androidx.work.ExistingPeriodicWorkPolicy
              import androidx.work.PeriodicWorkRequestBuilder
              import androidx.work.WorkManager
              import androidx.work.WorkerParameters
              import java.util.concurrent.TimeUnit

              class HadithUpdateWorker(
                  private val appContext: Context,
                  workerParams: WorkerParameters
              ) : CoroutineWorker(appContext, workerParams) {

                  override suspend fun doWork(): Result {
                      HadithRepository.fetchOnlineHadith(appContext)
                      HadithWidgetProvider.updateAllWidgets(appContext)
                      return Result.success()
                  }

                  companion object {
                      private const val WORK_NAME = "dorar_studio_v5_periodic_work"

                      fun schedulePeriodicUpdate(context: Context, hours: Long) {
                          val request = PeriodicWorkRequestBuilder<HadithUpdateWorker>(hours, TimeUnit.HOURS)
                              .build()
                          WorkManager.getInstance(context).enqueueUniquePeriodicWork(
                              WORK_NAME,
                              ExistingPeriodicWorkPolicy.UPDATE,
                              request
                          )
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/dorar/studiov5/HadithWidgetProvider.kt", r"""
              package com.dorar.studiov5

              import android.app.PendingIntent
              import android.appwidget.AppWidgetManager
              import android.appwidget.AppWidgetProvider
              import android.content.ComponentName
              import android.content.Context
              import android.content.Intent
              import android.graphics.Bitmap
              import android.graphics.Canvas
              import android.graphics.Color
              import android.graphics.Paint
              import android.graphics.RectF
              import android.util.TypedValue
              import android.widget.RemoteViews
              import android.widget.Toast
              import kotlinx.coroutines.CoroutineScope
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.launch
              import kotlinx.coroutines.withContext

              class HadithWidgetProvider : AppWidgetProvider() {

                  override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                      for (appWidgetId in appWidgetIds) {
                          updateAppWidget(context, appWidgetManager, appWidgetId)
                      }
                  }

                  override fun onReceive(context: Context, intent: Intent) {
                      super.onReceive(context, intent)
                      if (intent.action == ACTION_REFRESH) {
                          Toast.makeText(context, "جاري تحديث الحديث...", Toast.LENGTH_SHORT).show()
                          val pendingResult = goAsync()
                          CoroutineScope(Dispatchers.IO).launch {
                              try {
                                  HadithRepository.fetchOnlineHadith(context)
                                  withContext(Dispatchers.Main) {
                                      updateAllWidgets(context)
                                  }
                              } finally {
                                  pendingResult.finish()
                              }
                          }
                      }
                  }

                  companion object {
                      const val ACTION_REFRESH = "com.dorar.studiov5.ACTION_REFRESH"

                      fun updateAllWidgets(context: Context) {
                          val manager = AppWidgetManager.getInstance(context)
                          val ids = manager.getAppWidgetIds(ComponentName(context, HadithWidgetProvider::class.java))
                          for (id in ids) {
                              updateAppWidget(context, manager, id)
                          }
                      }

                      // توليد خلفية زجاجية بحواف دائرية باللون والشفافية التي يختارها المستخدم
                      private fun createGlassBitmap(bgColorHex: String, opacityPercent: Int, strokeColorHex: String): Bitmap {
                          val width = 800
                          val height = 400
                          val bmp = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888)
                          val canvas = Canvas(bmp)

                          val baseColor = try { Color.parseColor(bgColorHex) } catch (_: Exception) { Color.parseColor("#0F172A") }
                          val alpha = ((opacityPercent.coerceIn(0, 100) / 100f) * 255).toInt()
                          val fillColor = Color.argb(alpha, Color.red(baseColor), Color.green(baseColor), Color.blue(baseColor))

                          val rect = RectF(4f, 4f, width - 4f, height - 4f)
                          val radius = 56f

                          val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              style = Paint.Style.FILL
                              color = fillColor
                          }
                          canvas.drawRoundRect(rect, radius, radius, fillPaint)

                          if (opacityPercent > 5) {
                              val strokeBase = try { Color.parseColor(strokeColorHex) } catch (_: Exception) { Color.WHITE }
                              val strokePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                                  style = Paint.Style.STROKE
                                  strokeWidth = 3.5f
                                  color = Color.argb(90, Color.red(strokeBase), Color.green(strokeBase), Color.blue(strokeBase))
                              }
                              canvas.drawRoundRect(rect, radius, radius, strokePaint)
                          }

                          return bmp
                      }

                      fun updateAppWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                          val hadith = HadithRepository.getCurrentHadith(context)
                          val style = HadithRepository.getWidgetStyle(context)
                          val views = RemoteViews(context.packageName, R.layout.widget_hadith)

                          val textColor = try { Color.parseColor(style.textColorHex) } catch (_: Exception) { Color.WHITE }

                          views.setTextViewText(R.id.tv_widget_matn, hadith.matn)
                          views.setTextColor(R.id.tv_widget_matn, textColor)
                          views.setTextViewTextSize(R.id.tv_widget_matn, TypedValue.COMPLEX_UNIT_SP, style.fontSizeSp)

                          // تلوين أيقونة التحديث بنفس لون الخط المختار
                          views.setInt(R.id.btn_widget_refresh, "setColorFilter", textColor)

                          // رسم الخلفية الزجاجية المخصصة
                          val bgBitmap = createGlassBitmap(style.bgColorHex, style.opacityPercent, style.textColorHex)
                          views.setImageViewBitmap(R.id.iv_widget_bg, bgBitmap)

                          // فتح التطبيق عند الضغط على الحديث لقراءة الشرح والراوي
                          val openAppIntent = Intent(context, MainActivity::class.java)
                          val openAppPending = PendingIntent.getActivity(
                              context, 0, openAppIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(R.id.widget_root, openAppPending)
                          views.setOnClickPendingIntent(R.id.tv_widget_matn, openAppPending)
                          views.setOnClickPendingIntent(R.id.iv_widget_bg, openAppPending)

                          // زر التحديث الفوري
                          val refreshIntent = Intent(context, HadithWidgetProvider::class.java).apply {
                              action = ACTION_REFRESH
                          }
                          val refreshPending = PendingIntent.getBroadcast(
                              context, 1, refreshIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          views.setOnClickPendingIntent(R.id.btn_widget_refresh, refreshPending)

                          appWidgetManager.updateAppWidget(appWidgetId, views)
                      }
                  }
              }
          """)

