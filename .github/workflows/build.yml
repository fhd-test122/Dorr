name: Build Dorar Pro V3 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean and Generate Pro V3 Project
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          python3 - << 'PYEOF'
          import os, textwrap

          dirs = [
              "app/src/main/java/com/dorar/hadithpro",
              "app/src/main/res/layout",
              "app/src/main/res/drawable",
              "app/src/main/res/xml",
              "app/src/main/res/values"
          ]
          for d in dirs:
              os.makedirs(d, exist_ok=True)

          def write_file(path, content):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          write_file("settings.gradle.kts", r"""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "DorarProV3"
              include(":app")
          """)

          write_file("build.gradle.kts", r"""
              plugins {
                  id("com.android.application") version "8.2.2" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              }
          """)

          write_file("gradle.properties", r"""
              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              kotlin.code.style=official
              android.nonTransitiveRClass=true
          """)

          write_file("app/build.gradle.kts", r"""
              plugins {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
              }

              android {
                  namespace = "com.dorar.hadithpro"
                  compileSdk = 34

                  defaultConfig {
                      applicationId = "com.dorar.hadithpro"
                      minSdk = 26
                      targetSdk = 34
                      versionCode = 3
                      versionName = "3.0-Pro"
                  }

                  buildTypes {
                      release {
                          isMinifyEnabled = false
                      }
                  }
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }

              dependencies {
                  implementation("androidx.core:core-ktx:1.12.0")
                  implementation("androidx.appcompat:appcompat:1.6.1")
                  implementation("com.google.android.material:material:1.11.0")
                  implementation("androidx.constraintlayout:constraintlayout:2.1.4")
                  implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
                  implementation("androidx.work:work-runtime-ktx:2.9.0")
                  implementation("org.jsoup:jsoup:1.17.2")
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
                  implementation("com.google.code.gson:gson:2.10.1")
              }
          """)

          write_file("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

                  <application
                      android:allowBackup="false"
                      android:label="الدرر السنية Pro"
                      android:supportsRtl="true"
                      android:usesCleartextTraffic="true"
                      android:theme="@style/Theme.DorarHadith">

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:launchMode="singleTop">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>

                      <receiver
                          android:name=".HadithWidgetProvider"
                          android:exported="true"
                          android:label="ويدجت الدرر السنية Pro">
