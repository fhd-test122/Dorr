name: Build Dorar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Project
        run: |
          python3 - << 'PYEOF'
          import os
          for d in ["app/src/main/java/com/dorar/hadithwidget", "app/src/main/res/layout", "app/src/main/res/drawable", "app/src/main/res/xml"]:
              os.makedirs(d, exist_ok=True)

          files = {
          "settings.gradle.kts": 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "DorarApp"\ninclude(":app")',
          "build.gradle.kts": 'plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }',
          "gradle.properties": 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true',
          "app/build.gradle.kts": 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }\nandroid { namespace = "com.dorar.hadithwidget"; compileSdk = 34; defaultConfig { applicationId = "com.dorar.hadithwidget"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }\ndependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1"); implementation("com.google.android.material:material:1.11.0"); implementation("androidx.work:work-runtime-ktx:2.9.0"); implementation("org.jsoup:jsoup:1.17.2"); implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"); implementation("com.google.code.gson:gson:2.10.1") }',
          "app/src/main/AndroidManifest.xml": '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="أحاديث الدرر السنية" android:supportsRtl="true" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar"><activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".HadithWidgetProvider" android:exported="true" android:label="ويدجت الموسوعة الحديثية"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/><action android:name="com.dorar.hadithwidget.ACTION_REFRESH"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/hadith_widget_info"/></receiver></application></manifest>',
          "app/src/main/res/drawable/bg_glass.xml": '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:angle="135" android:startColor="#CC1E293B" android:endColor="#990F172A"/><corners android:radius="24dp"/><stroke android:width="1.5dp" android:color="#4DFFFFFF"/></shape>',
          "app/src/main/res/xml/hadith_widget_info.xml": '<?xml version="1.0" encoding="utf-8"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="250dp" android:minHeight="140dp" android:updatePeriodMillis="3600000" android:initialLayout="@layout/widget_hadith" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>',
          "app/src/main/res/layout/widget_hadith.xml": '<?xml version="1.0" encoding="utf-8"?><RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/widget_root" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@drawable/bg_glass" android:padding="16dp" android:layoutDirection="rtl"><LinearLayout android:id="@+id/top" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="الموسوعة الحديثية • حديث صحيح" android:textColor="#38BDF8" android:textSize="12sp" android:textStyle="bold"/><TextView android:id="@+id/btn_widget_share" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="مشاركة 📤" android:textColor="#E2E8F0" android:textSize="12sp" android:padding="4dp"/><TextView android:id="@+id/btn_widget_refresh" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="تحديث 🔄" android:textColor="#38BDF8" android:textSize="12sp" android:padding="4dp"/></LinearLayout><TextView android:id="@+id/tv_widget_matn" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_below="@id/top" android:layout_above="@+id/tv_widget_footer" android:layout_marginVertical="6dp" android:gravity="center_vertical" android:maxLines="5" android:ellipsize="end" android:textColor="#FFFFFF" android:textSize="15sp"/><TextView android:id="@+id/tv_widget_footer" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:textColor="#94A3B8" android:textSize="11sp" android:singleLine="true"/></RelativeLayout>',
          "app/src/main/res/layout/activity_main.xml": '<?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F172A" android:layoutDirection="rtl" android:padding="16dp"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="الموسوعة الحديثية - الدرر السنية" android:textColor="#38BDF8" android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="12dp"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="@drawable/bg_glass" android:orientation="horizontal" android:padding="8dp" android:layout_marginBottom="16dp"><EditText android:id="@+id/et_search" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:hint="ابحث في الدرر السنية..." android:textColorHint="#94A3B8" android:textColor="#FFFFFF" android:background="@android:color/transparent" android:padding="8dp"/><Button android:id="@+id/btn_search" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="بحث"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="@drawable/bg_glass" android:orientation="vertical" android:padding="16dp" android:layout_marginBottom="16dp"><TextView android:id="@+id/tv_main_matn" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold" android:layout_marginBottom="10dp"/><TextView android:id="@+id/tv_main_meta" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#38BDF8" android:textSize="13sp" android:layout_marginBottom="10dp"/><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="📖 شرح الحديث:" android:textColor="#FACC15" android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="6dp"/><TextView android:id="@+id/tv_main_sharh" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#E2E8F0" android:textSize="15sp"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="14dp"><Button android:id="@+id/btn_new_hadith" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="حديث جديد 🔄" android:layout_marginEnd="8dp"/><Button android:id="@+id/btn_add_fav" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="حفظ للمفضلة ⭐"/></LinearLayout></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="@drawable/bg_glass" android:orientation="vertical" android:padding="16dp" android:layout_marginBottom="16dp"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="⏱️ مؤقت تغيير الحديث تلقائياً:" android:textColor="#FFFFFF" android:textSize="15sp" android:textStyle="bold" android:layout_marginBottom="8dp"/><Spinner android:id="@+id/spinner_interval" android:layout_width="match_parent" android:layout_height="48dp" android:background="#CBD5E1"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="@drawable/bg_glass" android:orientation="vertical" android:padding="16dp"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="⭐ المفضلة:" android:textColor="#FACC15" android:textSize="16sp" android:textStyle="bold" android:layout_marginBottom="8dp"/><TextView android:id="@+id/tv_favorites_list" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#CBD5E1" android:textSize="14sp"/></LinearLayout></LinearLayout></ScrollView>',
          "app/src/main/java/com/dorar/hadithwidget/AppCode.kt": '''package com.dorar.hadithwidget
          import android.app.PendingIntent
          import android.appwidget.*
          import android.content.*
          import android.os.Bundle
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.work.*
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import kotlinx.coroutines.*
          import org.jsoup.Jsoup
          import java.util.concurrent.TimeUnit

          data class HadithItem(val matn: String, val rawi: String, val muhaddith: String, val source: String, val grade: String, val sharh: String)

          object HadithRepository {
              private const val PREFS = "dorar_prefs"
              private val gson = Gson()
              private val fbList = listOf(
                  HadithItem("قال رسول الله ﷺ: «إنَّما الأعمالُ بالنِّيَّاتِ، وإنَّما لكلِّ امرئٍ ما نوى»", "عمر بن الخطاب", "البخاري", "صحيح البخاري", "صحيح", "يبين النبي ﷺ أن مدار قبول الأعمال وصحتها وترتب الثواب عليها إنما هو بالنية الصالحة وإخلاص العمل لله وحده."),
                  HadithItem("قال رسول الله ﷺ: «الكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»", "أبو هريرة", "البخاري ومسلم", "صحيح البخاري", "صحيح", "كل كلام طيب يدخل السرور على قلب المؤمن أو يصلح بين الناس أو يذكر بالله فهو بمنزلة الصدقة بالمال في الأجر.")
              )
              suspend fun fetchOnlineHadith(c: Context, qStr: String? = null): HadithItem = withContext(Dispatchers.IO) {
                  try {
                      val q = qStr ?: listOf("الصدق", "الرحمة", "الصبر", "الذكر", "الصلاة", "البر", "الخلق", "الجنة").random()
                      val doc = Jsoup.connect("https://dorar.net/hadith/search?q=${java.net.URLEncoder.encode(q, "UTF-8")}&st=w&xclude=&d%5B%5D=1&d%5B%5D=2").userAgent("Mozilla/5.0").timeout(10000).get()
                      val list = mutableListOf<HadithItem>()
                      for (el in doc.select(".border-bottom")) {
                          val matn = el.selectFirst(".hadith")?.text()?.trim() ?: continue
                          if (matn.length in 25..350) {
                              val info = el.selectFirst(".hadith-info")?.text() ?: ""
                              val sUrl = el.selectFirst("a[href*='/hadith/sharh/']")?.attr("href")
                              var sharh = "حديث صحيح ثابت في السنة النبوية الشريفة، يحث على معالي الأخلاق والعمل الصالح."
                              if (!sUrl.isNullOrEmpty()) runCatching {
                                  val sDoc = Jsoup.connect(if (sUrl.startsWith("http")) sUrl else "https://dorar.net$sUrl").timeout(8000).get()
                                  sDoc.selectFirst(".text-justify")?.text()?.trim()?.let { if (it.isNotEmpty()) sharh = it }
                              }
                              list.add(HadithItem(matn, ext(info, "الراوي:", "المحدث:"), ext(info, "المحدث:", "المصدر:"), ext(info, "المصدر:", "الصفحة أو الرقم:"), "صحيح", sharh))
                          }
                      }
                      if (list.isNotEmpty()) return@withContext list.random().also { saveCur(c, it) }
                  } catch (_: Exception) {}
                  return@withContext fbList.random().also { saveCur(c, it) }
              }
              private fun ext(t: String, s: String, e: String): String {
                  val i = t.indexOf(s); if (i == -1) return "غير محدد"
                  val sub = t.substring(i + s.length); val j = sub.indexOf(e)
                  return if (j != -1) sub.substring(0, j).trim() else sub.take(25).trim()
              }
              fun getCur(c: Context): HadithItem = c.getSharedPreferences(PREFS, 0).getString("cur", null)?.let { gson.fromJson(it, HadithItem::class.java) } ?: fbList.first()
              fun saveCur(c: Context, h: HadithItem) = c.getSharedPreferences(PREFS, 0).edit().putString("cur", gson.toJson(h)).apply()
              fun addFav(c: Context, h: HadithItem) {
                  val l = getFavs(c).toMutableList()
                  if (l.none { it.matn == h.matn }) { l.add(0, h); c.getSharedPreferences(PREFS, 0).edit().putString("fav", gson.toJson(l)).apply() }
              }
              fun getFavs(c: Context): List<HadithItem> = c.getSharedPreferences(PREFS, 0).getString("fav", null)?.let { gson.fromJson(it, object : TypeToken<List<HadithItem>>() {}.type) } ?: emptyList()
              fun setInt(c: Context, h: Long) = c.getSharedPreferences(PREFS, 0).edit().putLong("int", h).apply()
              fun getInt(c: Context): Long = c.getSharedPreferences(PREFS, 0).getLong("int", 6L)
          }

          class HadithUpdateWorker(private val ctx: Context, p: WorkerParameters) : CoroutineWorker(ctx, p) {
              override suspend fun doWork(): Result { HadithRepository.fetchOnlineHadith(ctx); HadithWidgetProvider.updateAll(ctx); return Result.success() }
          }

          class HadithWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) = ids.forEach { upd(c, m, it) }
              override fun onReceive(c: Context, i: Intent) {
                  super.onReceive(c, i)
                  if (i.action == "com.dorar.hadithwidget.ACTION_REFRESH") {
                      val res = goAsync()
                      CoroutineScope(Dispatchers.IO).launch { try { HadithRepository.fetchOnlineHadith(c); updateAll(c) } finally { res.finish() } }
                  }
              }
              companion object {
                  fun updateAll(c: Context) {
                      val m = AppWidgetManager.getInstance(c)
                      m.getAppWidgetIds(ComponentName(c, HadithWidgetProvider::class.java)).forEach { upd(c, m, it) }
                  }
                  fun upd(c: Context, m: AppWidgetManager, id: Int) {
                      val h = HadithRepository.getCur(c)
                      val v = RemoteViews(c.packageName, R.layout.widget_hadith)
                      v.setTextViewText(R.id.tv_widget_matn, h.matn)
                      v.setTextViewText(R.id.tv_widget_footer, "الراوي: ${h.rawi} | ${h.source} (اضغط للشرح)")
                      val openP = PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      v.setOnClickPendingIntent(R.id.widget_root, openP); v.setOnClickPendingIntent(R.id.tv_widget_matn, openP)
                      val refP = PendingIntent.getBroadcast(c, 1, Intent(c, HadithWidgetProvider::class.java).setAction("com.dorar.hadithwidget.ACTION_REFRESH"), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      v.setOnClickPendingIntent(R.id.btn_widget_refresh, refP)
                      val sh = Intent.createChooser(Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, "${h.matn}\n\nالشرح: ${h.sharh}"), "مشاركة")
                      v.setOnClickPendingIntent(R.id.btn_widget_share, PendingIntent.getActivity(c, 2, sh, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      m.updateAppWidget(id, v)
                  }
              }
          }

          class MainActivity : AppCompatActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContentView(R.layout.activity_main)
                  val tvM: TextView = findViewById(R.id.tv_main_matn); val tvI: TextView = findViewById(R.id.tv_main_meta); val tvS: TextView = findViewById(R.id.tv_main_sharh); val tvF: TextView = findViewById(R.id.tv_favorites_list); val et: EditText = findViewById(R.id.et_search)
                  fun show(h: HadithItem) { tvM.text = h.matn; tvI.text = "الراوي: ${h.rawi} | المحدث: ${h.muhaddith} | المصدر: ${h.source}"; tvS.text = h.sharh }
                  fun upF() { val f = HadithRepository.getFavs(this); tvF.text = if (f.isEmpty()) "لا توجد أحاديث محفوظة." else f.joinToString("\n\n────\n\n") { "• ${it.matn}" } }
                  show(HadithRepository.getCur(this)); upF()
                  findViewById<Button>(R.id.btn_new_hadith).setOnClickListener { Toast.makeText(this, "جاري الجلب من الدرر السنية...", Toast.LENGTH_SHORT).show(); lifecycleScope.launch { show(HadithRepository.fetchOnlineHadith(this@MainActivity)); HadithWidgetProvider.updateAll(this@MainActivity) } }
                  findViewById<Button>(R.id.btn_search).setOnClickListener { val q = et.text.toString().trim(); if (q.isNotEmpty()) lifecycleScope.launch { show(HadithRepository.fetchOnlineHadith(this@MainActivity, q)); HadithWidgetProvider.updateAll(this@MainActivity) } }
                  findViewById<Button>(R.id.btn_add_fav).setOnClickListener { HadithRepository.addFav(this, HadithRepository.getCur(this)); upF(); Toast.makeText(this, "تم الحفظ ⭐", Toast.LENGTH_SHORT).show() }
                  val sp: Spinner = findViewById(R.id.spinner_interval); val vals = longArrayOf(1L, 3L, 6L, 12L, 24L)
                  sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, arrayOf("كل ساعة", "كل 3 ساعات", "كل 6 ساعات", "كل 12 ساعة", "كل 24 ساعة"))
                  sp.setSelection(vals.indexOf(HadithRepository.getInt(this)).coerceAtLeast(0))
                  sp.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                          HadithRepository.setInt(this@MainActivity, vals[pos])
                          WorkManager.getInstance(this@MainActivity).enqueueUniquePeriodicWork("dorar_w", ExistingPeriodicWorkPolicy.UPDATE, PeriodicWorkRequestBuilder<HadithUpdateWorker>(vals[pos], TimeUnit.HOURS).build())
                      }
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }
              }
          }
          '''
          }
          for path, content in files.items():
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip())
          PYEOF
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dorar-Hadith-Widget-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
