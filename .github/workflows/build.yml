                - name: Generate Part 2
        run: |
          cat << 'EOF' > app/src/main/java/com/dorar/hadithwidget/HadithRepository.kt
          package com.dorar.hadithwidget
          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.jsoup.Jsoup

          data class HadithItem(val matn: String, val rawi: String, val muhaddith: String, val source: String, val grade: String, val sharh: String)

          object HadithRepository {
              private const val PREFS = "dorar_prefs"
              private val gson = Gson()
              private val fallbackList = listOf(
                  HadithItem("قال رسول الله ﷺ: «إنَّما الأعمالُ بالنِّيَّاتِ، وإنَّما لكلِّ امرئٍ ما نوى»", "عمر بن الخطاب", "البخاري", "صحيح البخاري", "صحيح", "مدار قبول الأعمال وصحتها وترتب الثواب عليها إنما هو بالنية الصالحة وإخلاص العمل لله وحده."),
                  HadithItem("قال رسول الله ﷺ: «الكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ»", "أبو هريرة", "البخاري ومسلم", "صحيح البخاري", "صحيح", "كل كلام طيب يدخل السرور على قلب المؤمن أو يصلح بين الناس أو يذكر بالله فهو بمنزلة الصدقة بالمال في الأجر.")
              )

              suspend fun fetchOnlineHadith(context: Context, searchQuery: String? = null): HadithItem = withContext(Dispatchers.IO) {
                  try {
                      val q = searchQuery ?: listOf("الصدق", "الرحمة", "الصبر", "الذكر", "الصلاة", "البر", "الخلق", "الجنة").random()
                      val url = "https://dorar.net/hadith/search?q=${java.net.URLEncoder.encode(q, "UTF-8")}&st=w&xclude=&d%5B%5D=1&d%5B%5D=2"
                      val doc = Jsoup.connect(url).userAgent("Mozilla/5.0").timeout(10000).get()
                      val list = mutableListOf<HadithItem>()
                      for (el in doc.select(".border-bottom")) {
                          val matn = el.selectFirst(".hadith")?.text()?.trim() ?: continue
                          if (matn.length in 25..350) {
                              val info = el.selectFirst(".hadith-info")?.text() ?: ""
                              val sharhUrl = el.selectFirst("a[href*='/hadith/sharh/']")?.attr("href")
                              var sharh = "حديث صحيح ثابت في السنة النبوية الشريفة، يحث على معالي الأخلاق والعمل الصالح."
                              if (!sharhUrl.isNullOrEmpty()) {
                                  try {
                                      val sDoc = Jsoup.connect(if (sharhUrl.startsWith("http")) sharhUrl else "https://dorar.net$sharhUrl").timeout(8000).get()
                                      sDoc.selectFirst(".text-justify")?.text()?.trim()?.let { if (it.isNotEmpty()) sharh = it }
                                  } catch (_: Exception) {}
                              }
                              list.add(HadithItem(matn, extract(info, "الراوي:", "المحدث:"), extract(info, "المحدث:", "المصدر:"), extract(info, "المصدر:", "الصفحة أو الرقم:"), "صحيح", sharh))
                          }
                      }
                      if (list.isNotEmpty()) {
                          val chosen = list.random()
                          saveCurrent(context, chosen)
                          return@withContext chosen
                      }
                  } catch (_: Exception) {}
                  val fb = fallbackList.random()
                  saveCurrent(context, fb)
                  return@withContext fb
              }

              private fun extract(t: String, s: String, e: String): String {
                  val i = t.indexOf(s); if (i == -1) return "غير محدد"
                  val sub = t.substring(i + s.length); val j = sub.indexOf(e)
                  return if (j != -1) sub.substring(0, j).trim() else sub.take(25).trim()
              }

              fun getCurrentHadith(c: Context): HadithItem {
                  val j = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString("cur", null)
                  return if (j != null) gson.fromJson(j, HadithItem::class.java) else fallbackList.first()
              }

              fun saveCurrent(c: Context, item: HadithItem) {
                  c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString("cur", gson.toJson(item)).apply()
              }

              fun addFavorite(c: Context, item: HadithItem) {
                  val list = getFavorites(c).toMutableList()
                  if (list.none { it.matn == item.matn }) {
                      list.add(0, item)
                      c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString("fav", gson.toJson(list)).apply()
                  }
              }

              fun getFavorites(c: Context): List<HadithItem> {
                  val j = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString("fav", null) ?: return emptyList()
                  return gson.fromJson(j, object : TypeToken<List<HadithItem>>() {}.type)
              }

              fun setIntervalHours(c: Context, h: Long) = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putLong("int", h).apply()
              fun getIntervalHours(c: Context): Long = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getLong("int", 6L)
          }
          EOF
          cat << 'EOF' > app/src/main/java/com/dorar/hadithwidget/HadithUpdateWorker.kt
          package com.dorar.hadithwidget
          import android.content.Context
          import androidx.work.*
          import java.util.concurrent.TimeUnit

          class HadithUpdateWorker(private val ctx: Context, p: WorkerParameters) : CoroutineWorker(ctx, p) {
              override suspend fun doWork(): Result {
                  HadithRepository.fetchOnlineHadith(ctx)
                  HadithWidgetProvider.updateAllWidgets(ctx)
                  return Result.success()
              }
              companion object {
                  fun schedulePeriodicUpdate(c: Context, hours: Long) {
                      val req = PeriodicWorkRequestBuilder<HadithUpdateWorker>(hours, TimeUnit.HOURS).build()
                      WorkManager.getInstance(c).enqueueUniquePeriodicWork("dorar_work", ExistingPeriodicWorkPolicy.UPDATE, req)
                  }
              }
          }
          EOF
          cat << 'EOF' > app/src/main/java/com/dorar/hadithwidget/HadithWidgetProvider.kt
          package com.dorar.hadithwidget
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.*
          import android.widget.RemoteViews
          import kotlinx.coroutines.*

          class HadithWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) { ids.forEach { updateAppWidget(c, m, it) } }
              override fun onReceive(c: Context, i: Intent) {
                  super.onReceive(c, i)
                  if (i.action == "com.dorar.hadithwidget.ACTION_REFRESH") {
                      val res = goAsync()
                      CoroutineScope(Dispatchers.IO).launch {
                          try { HadithRepository.fetchOnlineHadith(c); updateAllWidgets(c) } finally { res.finish() }
                      }
                  }
              }
              companion object {
                  fun updateAllWidgets(c: Context) {
                      val m = AppWidgetManager.getInstance(c)
                      m.getAppWidgetIds(ComponentName(c, HadithWidgetProvider::class.java)).forEach { updateAppWidget(c, m, it) }
                  }
                  fun updateAppWidget(c: Context, m: AppWidgetManager, id: Int) {
                      val h = HadithRepository.getCurrentHadith(c)
                      val v = RemoteViews(c.packageName, R.layout.widget_hadith)
                      v.setTextViewText(R.id.tv_widget_matn, h.matn)
                      v.setTextViewText(R.id.tv_widget_footer, "الراوي: ${h.rawi} | ${h.source} (اضغط للشرح)")
                      val openP = PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      v.setOnClickPendingIntent(R.id.widget_root, openP)
                      v.setOnClickPendingIntent(R.id.tv_widget_matn, openP)
                      val refP = PendingIntent.getBroadcast(c, 1, Intent(c, HadithWidgetProvider::class.java).setAction("com.dorar.hadithwidget.ACTION_REFRESH"), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      v.setOnClickPendingIntent(R.id.btn_widget_refresh, refP)
                      val sh = Intent.createChooser(Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, "${h.matn}\n\nالشرح: ${h.sharh}"), "مشاركة")
                      v.setOnClickPendingIntent(R.id.btn_widget_share, PendingIntent.getActivity(c, 2, sh, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      m.updateAppWidget(id, v)
                  }
              }
          }
          EOF
          cat << 'EOF' > app/src/main/java/com/dorar/hadithwidget/MainActivity.kt
          package com.dorar.hadithwidget
          import android.os.Bundle
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val tvMatn: TextView = findViewById(R.id.tv_main_matn)
                  val tvMeta: TextView = findViewById(R.id.tv_main_meta)
                  val tvSharh: TextView = findViewById(R.id.tv_main_sharh)
                  val tvFav: TextView = findViewById(R.id.tv_favorites_list)
                  val etSearch: EditText = findViewById(R.id.et_search)
                  fun show(h: HadithItem) {
                      tvMatn.text = h.matn
                      tvMeta.text = "الراوي: ${h.rawi} | المحدث: ${h.muhaddith} | المصدر: ${h.source}"
                      tvSharh.text = h.sharh
                  }
                  fun updateFav() {
                      val f = HadithRepository.getFavorites(this)
                      tvFav.text = if (f.isEmpty()) "لا توجد أحاديث محفوظة." else f.joinToString("\n\n────\n\n") { "• ${it.matn}" }
                  }
                  show(HadithRepository.getCurrentHadith(this))
                  updateFav()
                  findViewById<Button>(R.id.btn_new_hadith).setOnClickListener {
                      Toast.makeText(this, "جاري الجلب من الدرر السنية...", Toast.LENGTH_SHORT).show()
                      lifecycleScope.launch { show(HadithRepository.fetchOnlineHadith(this@MainActivity)); HadithWidgetProvider.updateAllWidgets(this@MainActivity) }
                  }
                  findViewById<Button>(R.id.btn_search).setOnClickListener {
                      val q = etSearch.text.toString().trim()
                      if (q.isNotEmpty()) lifecycleScope.launch { show(HadithRepository.fetchOnlineHadith(this@MainActivity, q)); HadithWidgetProvider.updateAllWidgets(this@MainActivity) }
                  }
                  findViewById<Button>(R.id.btn_add_fav).setOnClickListener {
                      HadithRepository.addFavorite(this, HadithRepository.getCurrentHadith(this)); updateFav()
                      Toast.makeText(this, "تم الحفظ في المفضلة ⭐", Toast.LENGTH_SHORT).show()
                  }
                  val sp: Spinner = findViewById(R.id.spinner_interval)
                  val labels = arrayOf("كل ساعة", "كل 3 ساعات", "كل 6 ساعات", "كل 12 ساعة", "كل 24 ساعة")
                  val vals = longArrayOf(1L, 3L, 6L, 12L, 24L)
                  sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, labels)
                  sp.setSelection(vals.indexOf(HadithRepository.getIntervalHours(this)).coerceAtLeast(0))
                  sp.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                          HadithRepository.setIntervalHours(this@MainActivity, vals[pos])
                          HadithUpdateWorker.schedulePeriodicUpdate(this@MainActivity, vals[pos])
                      }
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Dorar-Hadith-Widget-APK
          path: app/build/outputs/apk/debug/app-debug.apk
